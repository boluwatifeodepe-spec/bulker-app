name: Backend CI

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "railway.json"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check index.js
          node --check routes/contacts.js
          node --check routes/send.js
          node --check routes/settings.js
          node --check routes/whatsapp.js
          node --check services/firebase.js
          node --check services/messageQueue.js
          node --check services/uploads.js
          node --check services/whatsapp.js
