name: Flutter APK Build

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL for the app build"
        required: true
        default: "https://your-backend-url.railway.app"
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  analyze-and-build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create platform folders
        run: flutter create . --platforms android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=BACKEND_URL="${{ github.event.inputs.backend_url || 'https://your-backend-url.railway.app' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bulker-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
