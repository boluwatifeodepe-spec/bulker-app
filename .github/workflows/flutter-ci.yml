name: Flutter APK Build

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL for the app build"
        required: true
        default: "https://your-backend-url.railway.app"
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  analyze-and-build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create platform folders
        run: flutter create . --platforms android

      - name: Use Android SDK 35
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
          if [ -f android/app/build.gradle ]; then
            perl -0pi -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
            perl -0pi -e 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 35/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            perl -0pi -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts
            perl -0pi -e 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 35/' android/app/build.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          set +e
          flutter build apk --release --dart-define=BACKEND_URL="${{ github.event.inputs.backend_url || 'https://your-backend-url.railway.app' }}" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "APK build failed. Last build lines:"
              tail -80 build.log
            } > build-summary.txt
            while IFS= read -r line; do
              echo "::error::$line"
            done < build-summary.txt
            exit "$status"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bulker-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
