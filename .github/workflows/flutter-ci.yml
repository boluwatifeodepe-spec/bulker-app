name: Flutter APK Build

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL for the app build"
        required: true
        default: "https://your-backend-url.railway.app"
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-ci.yml"

permissions:
  contents: write

jobs:
  analyze-and-build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create platform folders
        run: flutter create . --platforms android

      - name: Use Android SDK 35
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp android_assets/ic_launcher.xml android/app/src/main/res/drawable/ic_launcher.xml
          cp android_assets/ic_launcher_background.xml android/app/src/main/res/drawable/ic_launcher_background.xml
          cp android_assets/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml
          cp android_assets/ic_launcher_adaptive.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android_assets/ic_launcher_adaptive.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          perl -0pi -e 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher"/' android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's/android:roundIcon="@mipmap\/ic_launcher"/android:roundIcon="@mipmap\/ic_launcher_round"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.READ_CONTACTS" android/app/src/main/AndroidManifest.xml; then
            perl -0pi -e 's/<manifest([^>]*)>/<manifest$1>\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"\/>/' android/app/src/main/AndroidManifest.xml
          fi
          if [ -f android/app/build.gradle ]; then
            perl -0pi -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
            perl -0pi -e 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle
            perl -0pi -e 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 35/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            perl -0pi -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts
            perl -0pi -e 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
            perl -0pi -e 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 35/' android/app/build.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          set +e
          BACKEND_URL="${{ github.event.inputs.backend_url || vars.BULKER_BACKEND_URL || 'https://your-backend-url.railway.app' }}"
          flutter build apk --release --dart-define=BACKEND_URL="$BACKEND_URL" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "APK build failed. Last build lines:"
              grep -Ei "FAILURE|What went wrong|Execution failed|A problem occurred|error:|Exception|Could not|requires|Minimum supported|failed" build.log | tail -40
              echo "---"
              tail -20 build.log
            } > build-summary.txt
            while IFS= read -r line; do
              echo "::error::$line"
            done < build-summary.txt
            exit "$status"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bulker-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK download file
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p download
          cp mobile/build/app/outputs/flutter-apk/app-release.apk download/Bulker.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/Bulker.apk
          if git diff --cached --quiet; then
            echo "Download APK is already current."
          else
            git commit -m "Update downloadable Bulker APK"
            git push
          fi
