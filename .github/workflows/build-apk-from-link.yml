name: Build Bulker APK From Link

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Download Bulker source
        run: |
          curl -L "https://dirty-nights-show.loca.lt/uploads/bulker-upload.zip" -o bulker-upload.zip
          unzip -q bulker-upload.zip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create Android project
        working-directory: bulker-upload-package/mobile
        run: flutter create . --platforms android

      - name: Configure Android package
        working-directory: bulker-upload-package/mobile
        run: |
          perl -0pi -e 's/applicationId = ".*?"/applicationId = "com.bulker.app"/' android/app/build.gradle
          perl -0pi -e 's/namespace = ".*?"/namespace = "com.bulker.app"/' android/app/build.gradle
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            perl -0pi -e 's/<manifest([^>]*)>/<manifest$1>\n    <uses-permission android:name="android.permission.INTERNET"\/>/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        working-directory: bulker-upload-package/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: bulker-upload-package/mobile
        run: flutter analyze

      - name: Build APK
        working-directory: bulker-upload-package/mobile
        run: flutter build apk --release --dart-define=BACKEND_URL="https://dirty-nights-show.loca.lt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bulker-release-apk
          path: bulker-upload-package/mobile/build/app/outputs/flutter-apk/app-release.apk
