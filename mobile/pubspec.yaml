name: bulker
description: Send WhatsApp media campaigns to contact lists.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.0
  csv: ^6.0.0
  file_picker: ^5.0.0
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  go_router: ^12.0.0
  flutter_contacts: ^1.1.9+2
  http: ^1.2.2
  image_picker: ^1.1.2
  provider: ^6.1.2
  socket_io_client: ^3.0.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
